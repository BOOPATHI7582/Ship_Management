[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the local backend through the cloudflared quick tunnel.
# NOTE: quick-tunnel URLs change on every tunnel restart - update this line
# and redeploy whenever you restart the tunnel (run scripts\start-tunnel.cmd).
[[redirects]]
  from = "/api/*"
  to = "https://peer-brochures-leaving-reel.trycloudflare.com/api/:splat"
  status = 200
  force = true

# SPA fallback: let React Router handle all other routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
