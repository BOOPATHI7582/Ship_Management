[build]
  command = "npm run build"
  publish = "dist"

# Proxy API calls to the deployed Spring Boot backend.
# Replace the target with your real backend URL after deploying it.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-BACKEND-URL/api/:splat"
  status = 200
  force = true

# SPA fallback: let React Router handle all other routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
