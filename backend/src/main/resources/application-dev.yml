spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql-10afdaf4-shipmanagement.l.aivencloud.com:19172/defaultdb?ssl-mode=REQUIRED&serverTimezone=UTC}
    username: ${DB_USERNAME:avnadmin}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.company.exportplatform: DEBUG