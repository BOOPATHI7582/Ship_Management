services:
  # Spring Boot API (public web service)
  # Database: managed Aiven MySQL (external to Render).
  - type: web
    name: exportplatform-api
    runtime: docker
    plan: free
    region: singapore          # closest to India
    rootDir: backend
    dockerfilePath: Dockerfile
    healthCheckPath: /api/public/stats
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Aiven MySQL connection (created on Aiven, not part of this blueprint).
      - key: SPRING_DATASOURCE_URL
        sync: false            # e.g. jdbc:mysql://avnadmin:...@host:port/defaultdb?ssl-mode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        sync: false            # avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false            # Aiven password
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false            # e.g. https://ship-management-l8kk.vercel.app (frontend, for email links)
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # e.g. https://*.vercel.app (app default already covers this + localhost:5173)
      - key: MAIL_HOST
        sync: false            # smtp.gmail.com when email is configured
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false