services:
  - type: web
    name: exportplatform-api
    runtime: java
    plan: free
    region: singapore          # closest to India
    rootDir: backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/exportplatform-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
    healthCheckPath: /api/public/stats
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false            # set in dashboard: jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false            # your Netlify site URL, e.g. https://cool-pegasus-a4f560.netlify.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # same Netlify URL (comma-separated for multiple)
      - key: MAIL_HOST
        sync: false            # smtp.gmail.com when email is configured
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
